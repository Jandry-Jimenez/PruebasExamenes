<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación: Automatismos Programables</title>
    <style>
        :root {
            --primary: #1e293b;
            --primary-light: #334155;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --success: #15803d;
            --success-bg: #f0fdf4;
            --error: #b91c1c;
            --error-bg: #fef2f2;
            --warning: #b45309;
            --warning-bg: #fffbeb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .block-title {
            font-size: 1.15rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 35px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
            font-weight: 700;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .question-card:hover {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .option-label:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            margin-top: 5px;
            accent-color: var(--accent);
            transform: scale(1.1);
        }

        /* Result Styles */
        .option-label.correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            font-weight: 600;
        }

        .option-label.incorrect {
            background-color: var(--error-bg) !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            border-left: 4px solid;
        }

        .feedback-box.correct-feedback {
            background-color: var(--success-bg);
            border-left-color: var(--success);
            color: #166534;
        }

        .feedback-box.incorrect-feedback {
            background-color: var(--error-bg);
            border-left-color: var(--error);
            color: #991b1b;
        }

        .feedback-box.unanswered-feedback {
            background-color: var(--warning-bg);
            border-left-color: var(--warning);
            color: #92400e;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-correct { background-color: #dcfce7; color: #15803d; }
        .badge-incorrect { background-color: #fee2e2; color: #b91c1c; }
        .badge-unanswered { background-color: #fef3c7; color: #d97706; }

        /* Scoreboard Panel */
        .results-panel {
            background-color: var(--primary);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 4px solid rgba(255,255,255,0.2);
        }

        .score-num {
            font-size: 2.2rem;
            font-weight: 800;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 20px auto 0 auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .stat-item h4 {
            font-size: 0.85rem;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .stat-item p {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .btn-container {
            margin: 30px 0;
            text-align: center;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-reset {
            background-color: var(--primary-light);
            box-shadow: none;
            margin-left: 10px;
        }

        .btn-reset:hover {
            background-color: var(--primary);
        }

        .disabled-label {
            cursor: default !important;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cuestionario de Evaluación</h1>
        <p>Automatismos Programables &bull; 40 Preguntas</p>
    </header>

    <!-- Score Panel visible only after submission -->
    <div id="resultsPanel" class="results-panel">
        <div class="score-circle">
            <span class="score-num" id="scoreValue">0.0</span>
        </div>
        <h3>Resultado de la Evaluación</h3>
        <p id="scoreMessage" style="color: #cbd5e1; margin-top: 5px;"></p>
        <div class="stats-grid">
            <div class="stat-item">
                <h4>Correctas</h4>
                <p id="statsCorrect" style="color: #4ade80;">0</p>
            </div>
            <div class="stat-item">
                <h4>Incorrectas</h4>
                <p id="statsIncorrect" style="color: #f87171;">0</p>
            </div>
            <div class="stat-item">
                <h4>Sin responder</h4>
                <p id="statsUnanswered" style="color: #fbbf24;">0</p>
            </div>
        </div>
    </div>

    <!-- Quiz Form -->
    <form id="quizForm">
        <div id="quizContainer"></div>

        <div class="btn-container">
            <button type="button" id="submitBtn" class="btn" onclick="gradeQuiz()">Enviar y Corregir</button>
            <button type="button" id="resetBtn" class="btn btn-reset" onclick="resetQuiz()" style="display: none;">Reiniciar Evaluación</button>
        </div>
    </form>
</div>

<script>
    // Complete data representing the 40 questions of the blocks
    const quizData = [
        // BLOQUE 1
        {
            id: 1,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "En relación con las características que diferencian los sistemas de control en bucle abierto y en bucle cerrado:",
            options: {
                a: "Los sistemas en bucle abierto se caracterizan porque el sistema de control recibe retroalimentación constante del valor de la variable del proceso que quiere controlar, permitiendo estabilidad ante perturbaciones.",
                b: "Ninguna de las respuestas es correcta.",
                c: "Los sistemas en bucle cerrado se caracterizan por recibir información en sus entradas sobre el valor de la variable que controlan y, por lo tanto, se trata de sistemas que están realimentados.",

            },
            correct: "c",
            explanation: "Los sistemas en bucle cerrado están realimentados al recibir información de la salida mediante sensores. La opción 'a' es falsa porque describe el bucle cerrado pero lo atribuye al bucle abierto. La opción 'd' es falsa porque el bucle cerrado es más complejo de calibrar e instrumentar al requerir sensores y reguladores."
        },
        {
            id: 2,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "En la pirámide de la automatización industrial, respecto a las diferencias fundamentales entre el Nivel 4 y el Nivel 5:",
            options: {
                a: "El Nivel 4 monitoriza únicamente sistemas productivos, mientras que el Nivel 5 es el nivel de gestión integrado de la empresa que monitoriza tanto las partes productivas como las no productivas.",
                b: "El Nivel 4 monitoriza de forma integrada toda la infraestructura de la empresa (productiva y no productiva), mientras que el Nivel 5 supervisa únicamente los dispositivos de campo directamente.",
                c: "Todas las respuestas son correctas.",
                d: "El Nivel 4 se asocia directamente a la supervisión con sistemas SCADA locales de cada máquina, mientras que el Nivel 5 gestiona la nube a través del Nivel 6."
            },
            correct: "a",
            explanation: "La diferencia técnica fundamental radica en que el Nivel 4 monitoriza únicamente el sistema productivo, mientras que el Nivel 5 incluye la monitorización y gestión total de la empresa (tanto áreas productivas como no productivas)."
        },
        {
            id: 3,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "Con respecto al uso de las memorias RAM y EPROM en la Unidad Central de Procesos (CPU) de un autómata programable:",
            options: {
                a: "La memoria RAM es de carácter no volátil y mantiene el programa cargado aunque cese la alimentación eléctrica externa.",
                b: "Todas las respuestas son incorrectas.",
                c: "La memoria EPROM es de tipo volátil y se borra de manera inmediata cuando el autómata programable se queda sin suministro de tensión eléctrica.",
                d: "La memoria RAM es volátil y se borra al quedar el equipo sin alimentación, mientras que la EPROM es no volátil y mantiene el programa aunque cese la alimentación."
            },
            correct: "d",
            explanation: "La memoria RAM es por naturaleza volátil (requiere alimentación continua para retener los datos), mientras que la memoria EPROM es no volátil y resguarda la información permanentemente."
        },
        {
            id: 4,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "Respecto a la fuente de alimentación interna de un PLC y la conexión de los sensores:",
            options: {
                a: "La tensión de trabajo interna del autómata suele ser siempre de 230 V en corriente alterna para alimentar de forma directa los sensores analógicos de campo.",
                b: "Cuando se utiliza una gran cantidad de sensores activos que consumen corriente de forma significativa, se debe recurrir obligatoriamente a una fuente de alimentación externa para evitar sobrecargar la fuente interna del autómata.",
                c: "Los sensores de tipo pasivo nunca pueden ser alimentados directamente por el autómata programable, requiriendo en todo caso de un transformador intermedio de aislamiento galvánico.",
                d: "Ninguna de las respuestas es correcta."
            },
            correct: "b",
            explanation: "La fuente interna de la CPU tiene límites de salida estrictos. Un exceso de demanda por sensores activos puede sobrecargarla y dañarla, de manera que se requiere el uso de fuentes de alimentación externas."
        },
        {
            id: 5,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "En referencia a las características de los módulos de salidas digitales a relé y a transistor de un PLC:",
            options: {
                a: "Las salidas a relé son libres de tensión, soportan mayores corrientes y permiten conmutar tanto en corriente continua como en alterna, pero son más lentas en su conmutación que las salidas a transistor.",
                b: "Las salidas a transistor soportan mayores corrientes de salida que las de relé y pueden trabajar indistintamente con tensiones de corriente continua y corriente alterna en todo caso.",

            },
            correct: "a",
            explanation: "Las salidas de relé son electromecánicas, lo que les permite manejar mayores corrientes y ambos tipos de corriente (CA/CC), pero sufren de un tiempo de respuesta de conmutación muy superior al de los transistores de estado sólido."
        },
        {
            id: 6,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "En referencia a los estándares de señales del módulo de entradas analógicas de un autómata programable:",
            options: {
                a: "El estándar de tensión de 0 a 10 Vcc y el estándar de corriente de 4 a 20 mA son los rangos de señales más comúnmente utilizados en la industria.",
                b: "El estándar de corriente más utilizado para entradas analógicas se encuentra siempre en el rango de -10 a +10 mA.",
                c: "Ninguna de las respuestas es correcta.",

        {
            id: 7,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",

            options: {

                b: "En la lógica programada, cualquier cambio en el funcionamiento del proceso requiere únicamente reprogramar el PLC, evitando la necesidad de recablear el circuito de mando o reduciendo estas modificaciones al mínimo.",
                c: "La lógica cableada sustituye por completo el uso de la CPU y los sensores digitales de campo, haciendo que el PLC dependa exclusivamente de actuadores analógicos.",
                d: "Todas las respuestas son correctas."
            },
            correct: "b",
            explanation: "La flexibilidad es el principal beneficio de la lógica programada; las modificaciones de lógica se implementan alterando las líneas de código de software en lugar de reestructurar cableados físicos de mando."

        {
            id: 8,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",

            options: {
                a: "Todas las respuestas son incorrectas.",
                b: "Los autómatas compactos son aquellos en los que la fuente de alimentación está siempre fuera de la envolvente principal para optimizar la disipación térmica.",

            correct: "d",
            explanation: "Los PLC semicompactos cuentan con un núcleo principal pero externalizan ciertos módulos de base comunes, como por ejemplo la fuente de alimentación."
        },
        {
            id: 9,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",
            question: "Con respecto a los periféricos y el software de supervisión SCADA en los sistemas de control industrial:",
            options: {
                a: "El software SCADA se instala directamente en la memoria RAM del autómata para sustituir de manera íntegra a los interfaces de programación propios del PLC.",
                b: "Los paneles de operación (OP) son periféricos gráficos o textuales cuya única función en todo caso es forzar las salidas analógicas sin permitir la modificación de parámetros internos del sistema.",
                c: "Los programas SCADA permiten informar y controlar en todo momento el estado del proceso productivo desde la pantalla de un ordenador, pero no sustituyen a las interfaces de programación propias del PC.",
                d: "Ninguna de las respuestas es correcta."
            },
            correct: "c",
            explanation: "SCADA funciona como una capa superior de visualización, almacenamiento e interfaz con el operario mediante ordenadores o pantallas, operando de manera ajena e independiente al software técnico usado para programar la CPU del PLC."
        },
        {
            id: 10,
            block: 1,
            blockTitle: "Bloque 1: Introducción y estructura del autómata programable",

            explanation: "Las señales digitales (binarias) representan dos estados diferenciados (0 y 1 / Off y On), mientras que las señales analógicas describen un continuo infinito de valores intermedios dentro de una escala física definida."

        // BLOQUE 2

    // Function to render questions dynamically
    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';
        
        let currentBlock = 0;

        quizData.forEach((q, idx) => {
            // Render block header if it changes
            if (q.block !== currentBlock) {
                currentBlock = q.block;
                const blockHeader = document.createElement('h3');
                blockHeader.className = 'block-title';
                blockHeader.innerText = q.blockTitle;
                container.appendChild(blockHeader);
            }

            // Create question card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.id}`;

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `${idx + 1}. ${q.question}`;
            card.appendChild(qText);

            // Options container
            const optionsList = document.createElement('div');
            optionsList.className = 'options-list';

            Object.keys(q.options).forEach(optKey => {
                const optionItem = document.createElement('div');
                optionItem.className = 'option-item';

                const label = document.createElement('label');
                label.className = 'option-label';
                label.id = `label-${q.id}-${optKey}`;

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question-${q.id}`;
                radio.value = optKey;

                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${optKey}) ${q.options[optKey]}`));
                optionItem.appendChild(label);
                optionsList.appendChild(optionItem);
            });

            card.appendChild(optionsList);

            // Feedback box placeholder
            const feedback = document.createElement('div');
            feedback.className = 'feedback-box';
            feedback.id = `feedback-${q.id}`;
            card.appendChild(feedback);

            container.appendChild(card);
        });
    }

    // Function to correct and grade the quiz
    function gradeQuiz() {
        let correctCount = 0;
        let incorrectCount = 0;
        let unansweredCount = 0;

        quizData.forEach(q => {
            const selectedOpt = document.querySelector(`input[name="question-${q.id}"]:checked`);
            const card = document.getElementById(`card-${q.id}`);
            const feedbackBox = document.getElementById(`feedback-${q.id}`);
            
            // Remove previous badge or classes if present
            const oldBadge = card.querySelector('.badge');
            if (oldBadge) oldBadge.remove();

            const badge = document.createElement('span');
            badge.className = 'badge';

            // Process all labels in this question to lock them
            Object.keys(q.options).forEach(optKey => {
                const lbl = document.getElementById(`label-${q.id}-${optKey}`);
                lbl.classList.add('disabled-label');
                const radioInput = lbl.querySelector('input[type="radio"]');
                if (radioInput) radioInput.disabled = true;
            });

            if (!selectedOpt) {
                // Question was not answered
                unansweredCount++;
                badge.innerText = "Sin responder";
                badge.classList.add('badge-unanswered');
                card.insertBefore(badge, card.firstChild);

                // Highlight correct answer in green
                document.getElementById(`label-${q.id}-${q.correct}`).classList.add('correct');

                // Fill feedback
                feedbackBox.className = 'feedback-box unanswered-feedback';
                feedbackBox.innerHTML = `<strong>Opción correcta: ${q.correct.toUpperCase()}</strong>.<br>${q.explanation}`;
                feedbackBox.style.display = 'block';
            } else {
                const userChoice = selectedOpt.value;

                if (userChoice === q.correct) {
                    correctCount++;
                    badge.innerText = "Correcto";
                    badge.classList.add('badge-correct');
                    card.insertBefore(badge, card.firstChild);

                    // Green highlight
                    document.getElementById(`label-${q.id}-${q.correct}`).classList.add('correct');

                    // Fill feedback
                    feedbackBox.className = 'feedback-box correct-feedback';
                    feedbackBox.innerHTML = `<strong>¡Correcto!</strong>.<br>${q.explanation}`;
                    feedbackBox.style.display = 'block';
                } else {
                    incorrectCount++;
                    badge.innerText = "Incorrecto";
                    badge.classList.add('badge-incorrect');
                    card.insertBefore(badge, card.firstChild);

                    // Red highlight on user's choice and green on correct one
                    document.getElementById(`label-${q.id}-${userChoice}`).classList.add('incorrect');
                    document.getElementById(`label-${q.id}-${q.correct}`).classList.add('correct');

                    // Fill feedback
                    feedbackBox.className = 'feedback-box incorrect-feedback';
                    feedbackBox.innerHTML = `<strong>Respuesta incorrecta. La opción correcta es la ${q.correct.toUpperCase()}</strong>.<br>${q.explanation}`;
                    feedbackBox.style.display = 'block';
                }
            }
        });

        // Score scale 1 to 10
        const totalQuestions = quizData.length;
        const rawScore = (correctCount / totalQuestions) * 10;
        const finalScore = Math.round(rawScore * 100) / 100; // Round to 2 decimals

        // Render stats on top panel
        document.getElementById('scoreValue').innerText = finalScore.toFixed(1);
        document.getElementById('statsCorrect').innerText = correctCount;
        document.getElementById('statsIncorrect').innerText = incorrectCount;
        document.getElementById('statsUnanswered').innerText = unansweredCount;

        // Custom score text feedback
        let message = '';
        if (finalScore >= 9) {
            message = "Excelente asimilación de contenidos teóricos del autómata programable.";
        } else if (finalScore >= 7) {
            message = "Buen rendimiento general en los diferentes bloques de evaluación.";
        } else if (finalScore >= 5) {
            message = "Evaluación aprobada. Hay áreas conceptuales que se pueden repasar.";
        } else {
            message = "Es recomendable un repaso detenido de las explicaciones proporcionadas.";
        }
        document.getElementById('scoreMessage').innerText = message;

        // Visual layout updates
        document.getElementById('resultsPanel').style.display = 'block';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'inline-block';

        // Smooth scroll to top of page to see results panel
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Function to reset the quiz state
    function resetQuiz() {
        document.getElementById('resultsPanel').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'inline-block';
        document.getElementById('resetBtn').style.display = 'none';
        
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize the application on load
    window.onload = renderQuiz;
</script>
