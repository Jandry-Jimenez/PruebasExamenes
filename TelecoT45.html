<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Quiz - Examen de Equipamiento y Automatismos</title>
    <style>
        :root {
            --moodle-blue: #0f6cb5;
            --moodle-bg: #f8f9fa;
            --moodle-border: #dee2e6;
            --moodle-orange: #f29d38;
            --text-color: #333333;
            --success-color: #28a745;
            --danger-color: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--moodle-border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .moodle-logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--moodle-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .course-title {
            font-size: 0.95rem;
            color: #6a737d;
            border-left: 1px solid var(--moodle-border);
            padding-left: 10px;
        }

        .quiz-header-banner {
            background-color: var(--moodle-blue);
            color: #ffffff;
            padding: 25px 20px;
        }

        .quiz-header-banner h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .quiz-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .quiz-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Bloque de info superior */
        .block-selector-wrapper {
            background: #ffffff;
            border: 1px solid var(--moodle-border);
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .block-selector-wrapper label {
            font-weight: bold;
        }

        .btn-block {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-block:hover {
            background-color: #dee2e6;
        }

        .btn-block.active {
            background-color: var(--moodle-blue);
            color: #ffffff;
            border-color: var(--moodle-blue);
        }

        /* Tarjeta de Pregunta estilo Moodle */
        .que {
            display: flex;
            border: 1px solid #cad0d5;
            border-radius: 4px;
            margin-bottom: 20px;
            background-color: #ffffff;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .que {
                flex-direction: column;
            }
            .que .info {
                width: auto !important;
                border-right: none !important;
                border-bottom: 1px solid #cad0d5;
            }
        }

        .que .info {
            width: 140px;
            padding: 15px;
            background-color: var(--moodle-bg);
            border-right: 1px solid #cad0d5;
            font-size: 0.85rem;
            color: #555;
        }

        .que .info .qno {
            font-size: 1.1rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 5px;
        }

        .que .info .state {
            margin-bottom: 10px;
        }

        .que .info .grade-info {
            font-style: italic;
        }

        .que .content {
            flex: 1;
            padding: 20px;
        }

        .que .qtext {
            font-size: 1.05rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .que .image-container {
            margin-bottom: 15px;
            text-align: center;
        }

        .que .ablock {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .que .option-item {
            display: flex;
            align-items: flex-start;
            padding: 10px 12px;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            background-color: #fafbfc;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .que .option-item:hover {
            background-color: #f1f3f5;
        }

        .que .option-item input {
            margin-top: 4px;
            margin-right: 12px;
            cursor: pointer;
        }

        .que .option-item.correct-bg {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
        }

        .que .option-item.incorrect-bg {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .feedback-box.correct {
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid var(--success-color);
        }

        .feedback-box.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 5px solid var(--danger-color);
        }

        /* Sidebar Widgets */
        .card-widget {
            background-color: #ffffff;
            border: 1px solid var(--moodle-border);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-widget h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            border-bottom: 1px solid var(--moodle-border);
            padding-bottom: 8px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 35px;
            border: 1px solid #a1a1a8;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-item.answered {
            background-color: #ced4da;
            color: #212529;
        }

        .nav-item.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .nav-item.incorrect {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .nav-item.active {
            border: 2px solid var(--moodle-blue);
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d32f2f;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--moodle-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-submit:hover {
            background-color: #0d5ea1;
        }

        .score-banner {
            background-color: #e2f0d9;
            border: 1px solid #95c184;
            color: #385723;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

                </div>
                <button type="button" class="btn-submit" id="submit-btn" onclick="submitActiveBlock()">Finalizar y Enviar</button>

        </aside>
    </div>
</div>

    // Función de barajado (Algoritmo Fisher-Yates)
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Inicializar datos mezclados de manera segura para cada bloque
    function initializeBlocks() {
        for (const blockKey in originalDatabase) {
            // Mezclamos las preguntas del bloque
            const shuffledQs = shuffleArray(originalDatabase[blockKey]).map((q, idx) => {
                return {
                    id: `${blockKey}_q_${idx}`,
                    qText: q.qText,
                    imageType: q.imageType || null,
                    // Mezclamos las opciones
                    options: shuffleArray(q.options),
                    correct: q.correct
                };
            });

            quizState.blocks[blockKey] = {
                questions: shuffledQs,
                answers: {}, // Guardar las respuestas del usuario { questionId: selectedOptionText }
                submitted: false,
                score: null
            };
        }
    }

    // Dibujar bloque activo
    function renderActiveBlock() {
        const activeKey = quizState.activeBlock;
        const blockData = quizState.blocks[activeKey];
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        // Título dinámico según rango de bloques
        let mainTitle = "";
        const u4Blocks = ['CE3A', 'CE3D', 'CE3E', 'CE3G', 'CE4A'];
        
        if (u4Blocks.includes(activeKey)) {
            mainTitle = "EXAMEN UNIDAD 4: CONTROL DE EQUIPAMIENTO ELÉCTRICO Y ELECTRÓNICO";
        } else {
            mainTitle = "EXAMEN UNIDAD 5. AUTOMATISMOS PROGRAMABLES";
        }

        document.getElementById('block-banner-title').textContent = `${mainTitle} - Bloque ${activeKey}`;

        // Renderizar banner de nota si ya está enviado
        const scoreArea = document.getElementById('score-display-area');
        if (blockData.submitted) {
            scoreArea.innerHTML = `<div class="score-banner">Calificación final de este bloque: ${blockData.score.toFixed(2)} de 10,00</div>`;
            document.getElementById('submit-btn').style.display = 'none';
        } else {
            scoreArea.innerHTML = '';
            document.getElementById('submit-btn').style.display = 'block';
        }

        blockData.questions.forEach((q, index) => {
            const isAnswered = blockData.answers[q.id] !== undefined;
            const selectedAnswer = blockData.answers[q.id];
            const qNum = index + 1;

            const queDiv = document.createElement('div');
            queDiv.className = 'que';
            queDiv.id = `q-element-${q.id}`;

            // Columna de información
            let stateText = isAnswered ? "Respuesta guardada" : "Sin responder aún";
            let pointsText = "Puntúa como 1,00";
            if (blockData.submitted) {
                const isCorrect = selectedAnswer === q.correct;
                stateText = isCorrect ? "Respuesta correcta" : "Respuesta incorrecta";
                if (!isAnswered) stateText = "No respondida";
            }

            const infoHtml = `
                <div class="info">
                    <div class="qno">Pregunta ${qNum}</div>
                    <div class="state">${stateText}</div>
                    <div class="grade-info">${pointsText}</div>
                </div>
            `;

            // Contenedor de la pregunta y opciones
            let imageHtml = q.imageType ? `<div class="image-container">${getSVGContent(q.imageType)}</div>` : '';

            let optionsHtml = '';
            q.options.forEach((opt, optIdx) => {
                const letter = String.fromCharCode(97 + optIdx); // a, b, c, d
                const isSelected = selectedAnswer === opt;
                const isDisabled = blockData.submitted ? 'disabled' : '';
                
                let optClass = 'option-item';
                if (blockData.submitted) {
                    if (opt === q.correct) {
                        optClass += ' correct-bg';
                    } else if (isSelected && opt !== q.correct) {
                        optClass += ' incorrect-bg';
                    }
                }

                optionsHtml += `
                    <label class="${optClass}">
                        <input type="radio" name="input_${q.id}" value="${opt.replace(/"/g, '&quot;')}" 
                               onchange="saveAnswer('${q.id}', this.value)" ${isSelected ? 'checked' : ''} ${isDisabled}>
                        <span>${letter}. ${opt}</span>
                    </label>
                `;
            });

            let feedbackHtml = '';
            if (blockData.submitted) {
                if (selectedAnswer === q.correct) {
                    feedbackHtml = `<div class="feedback-box correct">✓ ¡Respuesta correcta!</div>`;
                } else {
                    feedbackHtml = `
                        <div class="feedback-box incorrect">
                            ✗ Respuesta incorrecta.<br>
                            <span style="font-weight: normal;">La respuesta correcta es: <strong>${q.correct}</strong></span>
                        </div>`;
                }
            }

            const contentHtml = `
                <div class="content">
                    <div class="qtext">${q.qText}</div>
                    ${imageHtml}
                    <div class="ablock">
                        <div class="answer">${optionsHtml}</div>
                    </div>
                    ${feedbackHtml}
                </div>
            `;

            queDiv.innerHTML = infoHtml + contentHtml;
            container.appendChild(queDiv);
        });

        renderNavigation();
    }

    // Renderizar la barra de navegación lateral Moodle
    function renderNavigation() {
        const activeKey = quizState.activeBlock;
        const blockData = quizState.blocks[activeKey];
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = '';

        blockData.questions.forEach((q, index) => {
            const qNum = index + 1;
            const btn = document.createElement('div');
            btn.className = 'nav-item';
            btn.textContent = qNum;

            const isAnswered = blockData.answers[q.id] !== undefined;

            if (blockData.submitted) {
                const isCorrect = blockData.answers[q.id] === q.correct;
                if (isAnswered && isCorrect) {
                    btn.classList.add('correct');
                } else if (isAnswered && !isCorrect) {
                    btn.classList.add('incorrect');
                } else {
                    btn.classList.add('incorrect'); // Sin responder se considera incorrecto al enviar
                }
            } else if (isAnswered) {
                btn.classList.add('answered');
            }

            btn.onclick = () => {
                const el = document.getElementById(`q-element-${q.id}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            grid.appendChild(btn);
        });
    }

    // Guardar respuesta provisional en el estado local del cliente
    function saveAnswer(qId, val) {
        const activeKey = quizState.activeBlock;
        quizState.blocks[activeKey].answers[qId] = val;
        renderNavigation();
        
        // Actualizar etiqueta de estado de respuesta rápida del DOM
        const qElem = document.getElementById(`q-element-${qId}`);
        if (qElem) {
            const stateDiv = qElem.querySelector('.info .state');
            if (stateDiv) stateDiv.textContent = "Respuesta guardada";
        }
    }

    // Cambiar entre los distintos bloques del examen
    function switchBlock(blockKey) {
        // Guardar estado visual activo de botones superiores
        const buttons = document.querySelectorAll('.btn-block');
        buttons.forEach(btn => {
            if (btn.textContent === blockKey) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        quizState.activeBlock = blockKey;
        renderActiveBlock();
    }

    // Calcular nota del bloque y corregir
    function submitActiveBlock() {
        const activeKey = quizState.activeBlock;
        const blockData = quizState.blocks[activeKey];

        if (blockData.submitted) return;

        let correctCount = 0;
        blockData.questions.forEach(q => {
            const userAns = blockData.answers[q.id];
            if (userAns !== undefined && userAns === q.correct) {
                correctCount++;
            }
        });

        // Nota escalada del 0 al 10 según respuestas acertadas
        const finalScore = (correctCount / blockData.questions.length) * 10;
        
        blockData.score = finalScore;
        blockData.submitted = true;

        renderActiveBlock();
    }

    // Simular un temporizador de Moodle que desciende paulatinamente (20 minutos)
    function startTimer() {
        let seconds = 20 * 60; // Establecido en 20 minutos
        const timerLabel = document.getElementById('timer');
        
        const interval = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(interval);
                timerLabel.textContent = "¡Tiempo agotado!";
                return;
            }
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            timerLabel.textContent = `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);
    }

    // Ejecutar al iniciar página
    window.onload = () => {
        initializeBlocks();
        renderActiveBlock();
        startTimer();
    };
</script>
